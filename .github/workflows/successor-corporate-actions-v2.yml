name: successor-corporate-actions-v2

on:
  push:
    branches:
      - governance/phase6-successor-corporate-actions-v2
  pull_request:
    paths:
      - "src/investment_tracker/quant/successor/**"
      - "tests/quant/test_successor_corporate_actions_v2.py"
      - "tests/independent_audit/test_successor_authority.py"
      - "tests/independent_audit/test_successor_holdout_selection.py"
      - "src/investment_tracker/independent_audit/successor/**"
      - "data/governance/successor/**"
      - "docs/superpowers/reports/2026-09-23-gen2-phase6-split-root-cause.md"
      - "docs/superpowers/requests/2026-09-23-successor-independent-audit-request.md"
      - ".github/workflows/successor-corporate-actions-v2.yml"

jobs:
  successor-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev,quant,audit]'
      - name: Compile successor code
        run: python -m compileall -q src/investment_tracker/quant/successor
      - name: Focused successor regression tests
        run: python -m pytest -q tests/quant/test_successor_corporate_actions_v2.py tests/independent_audit/test_successor_authority.py tests/independent_audit/test_successor_holdout_selection.py
      - name: Governance boundary
        run: |
          ! grep -R -nE 'OpenTradeContext|place_order|modify_order|cancel_order|unlock_trade|TrdEnv' src/investment_tracker/quant/successor src/investment_tracker/independent_audit/successor tests/quant/test_successor_corporate_actions_v2.py tests/independent_audit/test_successor_authority.py tests/independent_audit/test_successor_holdout_selection.py
          ! grep -R -nE 'BNO|GBIL|CWS|ESG|VICI' src/investment_tracker/quant/successor tests/quant/test_successor_corporate_actions_v2.py
          python - <<'PY'
          import json
          from pathlib import Path

          contract = json.loads(Path("data/governance/successor/corporate-action-normalization-v2.json").read_text())
          request = json.loads(Path("data/governance/successor/independent-audit-request.json").read_text())
          closure = json.loads(Path("data/generation2/phase6/phase6-final-holdout-closure.json").read_text())

          assert contract["status"] == "PROPOSED_AWAITING_INDEPENDENT_AUDIT"
          assert contract["protected_data"]["historical_access_authorized"] is False
          assert request["status"] == "DRAFT_NOT_APPROVED"
          assert request["authority_granted"] is False
          assert request["phase7_authorized"] is False
          assert closure["status"] == "PHASE6_UNKNOWN_ABSTAIN"
          assert closure["evaluation"]["one_time_consumed"] is True
          assert closure["phase7"]["authorized"] is False
          assert closure["recon009_status"] == "OPEN"
          PY
