name: successor-dividend-normalization-v3

concurrency:
  group: successor-dividend-normalization-v3-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    paths:
      - "src/investment_tracker/quant/successor/dividend_reconciliation_v3.py"
      - "src/investment_tracker/independent_audit/successor/evaluate_dividend_v3.py"
      - "tests/quant/test_successor_dividend_reconciliation_v3.py"
      - "tests/independent_audit/test_successor_dividend_evaluator_v3.py"
      - "data/governance/successor/dividend-reconciliation-v3.json"
      - "data/governance/holdout-exclusion-registry.json"
      - ".github/workflows/successor-dividend-normalization-v3.yml"
  pull_request:
    paths:
      - "src/investment_tracker/quant/successor/dividend_reconciliation_v3.py"
      - "src/investment_tracker/independent_audit/successor/evaluate_dividend_v3.py"
      - "tests/quant/test_successor_dividend_reconciliation_v3.py"
      - "tests/independent_audit/test_successor_dividend_evaluator_v3.py"
      - "data/governance/successor/dividend-reconciliation-v3.json"
      - "data/governance/holdout-exclusion-registry.json"
      - ".github/workflows/successor-dividend-normalization-v3.yml"

jobs:
  successor-dividend-v3:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev,quant,audit]'

      - name: Compile successor dividend code
        run: |
          python -m compileall -q             src/investment_tracker/quant/successor/dividend_reconciliation_v3.py             src/investment_tracker/independent_audit/successor/evaluate_dividend_v3.py

      - name: Focused successor dividend regression tests
        run: |
          python -m pytest -q             tests/quant/test_successor_corporate_actions_v2.py             tests/quant/test_successor_dividend_reconciliation_v3.py             tests/independent_audit/test_successor_dividend_evaluator_v3.py

      - name: Governance boundary
        shell: bash
        run: |
          ! grep -R -nE 'OpenTradeContext|place_order|modify_order|cancel_order|unlock_trade|TrdEnv'             src/investment_tracker/quant/successor/dividend_reconciliation_v3.py             src/investment_tracker/independent_audit/successor/evaluate_dividend_v3.py             tests/quant/test_successor_dividend_reconciliation_v3.py             tests/independent_audit/test_successor_dividend_evaluator_v3.py
          ! grep -R -nE '\b(ACV|GVIP|WBIY|FCEF|FDLO)\b'             src/investment_tracker/quant/successor/dividend_reconciliation_v3.py             src/investment_tracker/independent_audit/successor/evaluate_dividend_v3.py             tests/quant/test_successor_dividend_reconciliation_v3.py             tests/independent_audit/test_successor_dividend_evaluator_v3.py
          python - <<'PY'
          from hashlib import sha256
          import json
          from pathlib import Path

          closure = json.loads(Path(
              "data/generation3/phase6/phase6-final-holdout-closure.json"
          ).read_text())
          assert closure["status"] == "PHASE6_UNKNOWN_ABSTAIN"
          assert closure["one_time_semantics"]["holdout_consumed"] is True
          assert closure["one_time_semantics"]["retry_authorized"] is False
          assert closure["phase7"]["authorized"] is False
          assert closure["recon009_status"] == "OPEN"

          old_evaluator = Path(
              "src/investment_tracker/independent_audit/successor/evaluate.py"
          )
          assert sha256(old_evaluator.read_bytes()).hexdigest() == (
              "c933cc2b71bf068f9db1f4656f7fea57ed3a5e0307819abc177897782e63e0ea"
          )

          registry = json.loads(Path(
              "data/governance/holdout-exclusion-registry.json"
          ).read_text())
          symbols = {
              symbol
              for group in registry["permanent_exclusions"]
              for symbol in group["symbols"]
          }
          assert len(symbols) == 28
          groups = [
              group for group in registry["permanent_exclusions"]
              if group["reason"]
              == "GENERATION3_FINAL_HOLDOUT_FROZEN_ACCESSED_AND_CONSUMED"
          ]
          assert len(groups) == 1
          assert len(groups[0]["symbols"]) == 5
          PY
