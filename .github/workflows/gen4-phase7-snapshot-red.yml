name: gen4-phase7-snapshot-red

on:
  push:
    branches:
      - audit/gen4-phase7-snapshot-red-20260928
    paths:
      - ".github/workflows/gen4-phase7-snapshot-red.yml"

jobs:
  red:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 98a164dad9145f5db4c9c9254c1ebfea97dbb9f8
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev,quant,audit]'
      - name: Expected RED tests
        run: |
          python -m pytest -q tests/independent_audit/test_generation4_phase7_snapshot_integrity.py
