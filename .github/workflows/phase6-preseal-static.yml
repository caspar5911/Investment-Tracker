name: phase6-preseal-static

on:
  push:
    branches:
      - codex/phase6-final-holdout-preseal
  pull_request:

jobs:
  phase6-preseal-static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev,quant]'
      - run: python -m compileall -q src/investment_tracker/quant/phase6
      - name: Phase 6 pre-unseal contracts
        run: >-\n          python -m pytest -q\n          tests/quant/test_phase6_preseal.py\n          tests/quant/test_phase6_cli.py
      - name: Phase 4 authority regressions
        run: >-
          python -m pytest -q
          tests/quant/test_phase5_authority.py
          tests/quant/test_phase4_finalization_audit.py
      - name: Verify sealed Phase 4 evidence remains untouched
        run: |
          git diff --exit-code 69bb4347cbe577c4a1277335eef778ddf5b177d0 HEAD --             src/investment_tracker/quant/phase4             results/phase4/finalization
      - name: Ensure pre-unseal package has no provider or trading surface
        run: |
          ! grep -R -n -E 'OpenQuoteContext|request_history_kline|OpenSecTradeContext|place_order|unlock_trade|modify_order'             src/investment_tracker/quant/phase6
      - name: Ensure locked replacement symbols are not embedded in Phase 6 code
        run: |
          ! grep -R -n -E 'HACK|SOXX|NLR|URNM|GEV'             src/investment_tracker/quant/phase6
