name: gen4-phase7-accounting-green2

on:
  push:
    branches:
      - audit/gen4-phase7-accounting-green2-20260928
    paths:
      - ".github/workflows/gen4-phase7-accounting-green2.yml"

jobs:
  focused:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: c1a59c46b4fe22bd37680c6134ad8bd94bc49c8d
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev,quant,audit]'
      - name: Phase 7 focused suite
        run: |
          python -m pytest -q             tests/independent_audit/test_generation4_phase7_accounting_path.py             tests/independent_audit/test_generation4_phase7_snapshot_integrity.py             tests/independent_audit/test_generation4_phase7_data_boundary.py             tests/independent_audit/test_generation4_phase7_evaluation_cli.py             tests/quant/test_generation4_phase7_durability.py
      - name: Compile
        run: |
          python -m compileall -q src/investment_tracker/independent_audit/post_generation3 src/investment_tracker/quant/phase7
