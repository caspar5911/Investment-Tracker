name: phase5-static

on:
  push:
    branches:
      - codex/phase5-decision-grade-reconstruction
  pull_request:

jobs:
  phase5-static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev,quant]'
      - run: python -m compileall -q src/investment_tracker/quant/phase5
      - run: >-
          python -m pytest -q
          tests/quant/test_phase5_methodology.py
          tests/quant/test_phase5_opend.py
          tests/quant/test_phase5_reconstruction.py
      - name: Verify Phase 4 finalization bytes are untouched
        run: |
          git diff --exit-code 69bb4347cbe577c4a1277335eef778ddf5b177d0 HEAD --             src/investment_tracker/quant/phase4             results/phase4/finalization
