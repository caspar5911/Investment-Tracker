name: gen4-phase7-accounting-red

on:
  push:
    branches:
      - audit/gen4-phase7-accounting-red-20260928
    paths:
      - ".github/workflows/gen4-phase7-accounting-red.yml"

jobs:
  red:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 5e8f7b550adef9c7255a167dbe17a6af73990499
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev,quant,audit]'
      - name: Expected RED accounting tests
        run: |
          python -m pytest -q tests/independent_audit/test_generation4_phase7_accounting_path.py
