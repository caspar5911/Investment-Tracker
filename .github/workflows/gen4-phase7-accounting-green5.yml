name: gen4-phase7-accounting-green5

on:
  push:
    branches:
      - audit/gen4-phase7-accounting-green5-20260928
    paths:
      - ".github/workflows/gen4-phase7-accounting-green5.yml"

jobs:
  focused:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 5149ac70d2561abff4b2cc6d2b8c75dbedfa3bd2
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev,quant,audit]'
      - name: Phase 7 focused suite
        run: |
          python -m pytest -q             tests/independent_audit/test_generation4_phase7_accounting_path.py             tests/independent_audit/test_generation4_phase7_snapshot_integrity.py             tests/independent_audit/test_generation4_phase7_data_boundary.py             tests/independent_audit/test_generation4_phase7_evaluation_cli.py             tests/independent_audit/test_generation4_phase7_authorization.py             tests/quant/test_generation4_phase7_durability.py
      - name: Compile
        run: |
          python -m compileall -q src/investment_tracker/independent_audit/post_generation3 src/investment_tracker/quant/phase7
