services:
  api:
    build:
      context: ../..
      dockerfile: apps/research-ui/backend/Dockerfile
    volumes:
      - ../../data:/repo/data:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
  web:
    build: ./frontend
    ports:
      - "${INVESTMENT_TRACKER_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/health >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5